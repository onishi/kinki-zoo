name = "kinki-zoo"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "kinki-zoo-animals"
database_id = "7d9c4176-c896-4b7b-a50d-c7e46967ccea"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "kinki-zoo-images"

[[routes]]
pattern = "kinki-zoo.wagaya.org/*"
zone_name = "wagaya.org"

[triggers]
crons = ["0 18 * * *"]
