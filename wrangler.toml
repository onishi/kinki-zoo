name = "kinki-zoo"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "kinki-zoo-animals"
database_id = "7d9c4176-c896-4b7b-a50d-c7e46967ccea"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "kinki-zoo-images"

[[routes]]
pattern = "kinki-zoo.wagaya.org"
custom_domain = true

[triggers]
# 0 18 * * *: お知らせ・動物一覧の更新（03:00 JST）
# 5,20,35,50 * * * *: AI レビューで保留の下書きを最大 5 件作り直し、出典の転送リンクを 30 件元の URL に置き換え、未作成の種を 4 種生成（src/index.ts の PROFILE_GENERATION_CRON）
# */15 * * * *: 動物プロフィールの下書きを 10 件ずつ AI レビューし、問題なければ公開（PROFILE_REVIEW_CRON）
crons = ["0 18 * * *", "5,20,35,50 * * * *", "*/15 * * * *"]
